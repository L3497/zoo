<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14281d">
<title>Zoo Wächter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ui:'Fredoka',system-ui,-apple-system,"Segoe UI",sans-serif;--mil:'Teko','Fredoka',system-ui,sans-serif;--acc:#ffc43d;--acc2:#ff9f1c;--grn:#2fbf71;--red:#ff5d5d;--ink:#22302a;--cream:#fffaf0;--glass:rgba(10,24,18,.58);--dockH:200px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0d1a12;font-family:var(--ui);color:#fff}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fl{position:absolute;left:0;top:0;font:700 15px var(--ui);white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.4);translate:-50% -50%;will-change:transform}
.hb{position:absolute;left:0;top:0;width:38px;height:5px;margin-left:-19px;background:rgba(0,0,0,.6);border-radius:3px;overflow:visible;transition:opacity .2s}
.hb i{display:block;height:100%;background:linear-gradient(90deg,#ff3b3b,#ff7a59);border-radius:3px}
.hb.boss{width:64px;margin-left:-32px;height:7px}.hb.boss i{background:linear-gradient(90deg,#c026d3,#ff3b8a)}
.hb b{position:absolute;left:50%;top:-30px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:conic-gradient(#ffc43d var(--p,0%),rgba(0,0,0,.55) 0);display:none;box-shadow:0 0 10px rgba(255,180,0,.6)}
.hb b:after{content:"✋";position:absolute;inset:3px;border-radius:50%;background:#1a1a22;display:grid;place-items:center;font-size:11px;font-style:normal}
.ea{position:absolute;left:0;top:0;width:0;height:0;border-left:15px solid #ff4040;border-top:9px solid transparent;border-bottom:9px solid transparent;margin:-9px 0 0 -8px;filter:drop-shadow(0 0 4px rgba(255,0,0,.8));display:none}
.ea.car{border-left-color:#ffc43d;animation:blink .4s infinite alternate}
@keyframes blink{to{opacity:.35}}
#lock{position:absolute;left:0;top:0;display:none;border:2px solid transparent;background:
 linear-gradient(#ff4040,#ff4040) top left/12px 2px no-repeat,linear-gradient(#ff4040,#ff4040) top left/2px 12px no-repeat,
 linear-gradient(#ff4040,#ff4040) top right/12px 2px no-repeat,linear-gradient(#ff4040,#ff4040) top right/2px 12px no-repeat,
 linear-gradient(#ff4040,#ff4040) bottom left/12px 2px no-repeat,linear-gradient(#ff4040,#ff4040) bottom left/2px 12px no-repeat,
 linear-gradient(#ff4040,#ff4040) bottom right/12px 2px no-repeat,linear-gradient(#ff4040,#ff4040) bottom right/2px 12px no-repeat;filter:drop-shadow(0 0 3px rgba(255,0,0,.7))}
.hm{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;background:
 linear-gradient(45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%);
 -webkit-mask:radial-gradient(circle,transparent 4px,#000 5px);mask:radial-gradient(circle,transparent 4px,#000 5px);animation:hm .26s ease-out forwards}
.hm.k{filter:drop-shadow(0 0 3px red) hue-rotate(0deg);background:linear-gradient(45deg,transparent 42%,#ff3b3b 42%,#ff3b3b 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,#ff3b3b 42%,#ff3b3b 58%,transparent 58%)}
@keyframes hm{from{scale:1.5}to{scale:1;opacity:0}}
/* ---------- Top-HUD ---------- */
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 8px 0;display:flex;gap:5px;align-items:center;z-index:6;pointer-events:none}
#top>*{pointer-events:auto}
.hp{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px 0 5px;min-width:0;border-radius:15px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.28);white-space:nowrap}
.coin{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c4,#ffc43d 45%,#d98a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22),0 0 0 2px rgba(255,220,120,.35);display:grid;place-items:center;font:700 13px var(--ui);color:#8a5a00}
.mv{display:flex;flex-direction:column;line-height:1}
.mv b{font:700 16px var(--ui);letter-spacing:.2px}
.mv small{font:600 10.5px var(--ui);color:#9ff0b8;margin-top:2px}
#cMoney.neg .mv b{color:#ff9b9b}
#cMoney.pulse{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.07)}}
.ring{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--acc) var(--p,0%),rgba(255,255,255,.15) 0)}
.ring span{width:20px;height:20px;border-radius:50%;background:#173326;display:grid;place-items:center;font-size:12px}
body.night .ring{background:conic-gradient(#7c8cff var(--p,0%),rgba(255,255,255,.15) 0)}
body.night .ring span{background:#141a34}
.info b{font:700 14px var(--ui)} .info small{display:block;font:500 10.5px var(--ui);opacity:.75}
.grow{flex:1}
.rb{position:relative;width:37px;height:37px;flex:0 0 37px;border-radius:14px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.28);font-size:19px;display:grid;place-items:center}
.rb i{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#ff5d8f;color:#fff;font:700 11px/19px var(--ui);font-style:normal;display:none;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.rb svg{width:24px;height:24px}
.rb:active,.card:active,.btn:active,.nb:active,.tab:active,.pill:active{transform:scale(.92)}
body.night #bZoo,body.night #bBaby{display:none}
/* ---------- Dock ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(180deg,rgba(255,251,242,.97),#f6ecd6);color:var(--ink);border-radius:26px 26px 0 0;padding:6px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -10px 34px rgba(0,0,0,.32)}
#dock:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#e0d2b0;margin:0 auto 6px}
body.night #dock{display:none}
#dctl{position:absolute;right:10px;top:-52px;display:flex;gap:7px}
.pill{height:40px;padding:0 12px;border-radius:14px;font:600 14px var(--ui);background:var(--glass);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 6px 16px rgba(0,0,0,.3)}
.pill.sq{width:40px;padding:0;font-size:20px}
#rctl{position:absolute;left:10px;top:-52px;display:flex;gap:7px}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,20,.22));transition:background 1s}
body.pp #vig{display:none}
body.night #vig{background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,15,.55))}
.pill.moon{background:linear-gradient(135deg,#5a6be0,#26306e);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 6px 18px rgba(40,50,140,.5)}
#tabs,#filters,#tools{display:flex;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar,#filters::-webkit-scrollbar,#tools::-webkit-scrollbar,.acats::-webkit-scrollbar,.camos::-webkit-scrollbar{display:none}
#tabs{gap:4px;padding:0 8px 6px}
.tab{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;min-width:50px;padding:5px 7px 4px;border-radius:15px;color:#806e4a;font:600 10.5px var(--ui)}
.tab b{font-size:21px;line-height:1.15;font-weight:400}
.tab.on{background:#2d6a4f;color:#fff;box-shadow:0 3px 0 #1b4332,0 6px 12px rgba(27,67,50,.3)}
#filters{gap:5px;padding:0 10px 6px}
.flt{flex:0 0 auto;border-radius:11px;padding:3px 10px;background:#efe3c3;font:500 12.5px var(--ui);color:#5b4a2a}
.flt.on{background:var(--acc);color:#3a2a00}
#tools{gap:9px;padding:3px 10px 4px}
.card{position:relative;flex:0 0 auto;width:86px;padding:5px 4px 6px;border-radius:19px;background:#fff;box-shadow:0 2px 0 #e6d6b0,0 4px 12px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;font:600 11.5px/1.15 var(--ui);text-align:center;color:var(--ink);transition:transform .1s}
.card .th{position:relative;width:70px;height:62px;display:grid;place-items:center;font-size:34px;border-radius:15px;background:radial-gradient(circle at 50% 65%,#f4f8ea,#e3ead2);overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:contain;transition:opacity .2s}
.card .th .fb{position:absolute;font-size:30px}
.card .th img.tile{width:44px;height:44px;border-radius:6px;transform:perspective(120px) rotateX(48deg) rotateZ(45deg);box-shadow:0 8px 8px rgba(0,0,0,.2)}
.card .nm{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.card .pr{margin-top:3px;font:600 11px var(--ui);padding:1px 8px;border-radius:8px;background:#e6f6ec;color:#1f7a4a}
.card.poor .pr{background:#ffe8e8;color:#d33}
.card .tag{position:absolute;top:4px;right:6px;font-size:13px;z-index:1}
.card.on{background:linear-gradient(180deg,#fff4c8,#ffd166);box-shadow:0 2px 0 #c98a00,0 6px 16px rgba(255,180,0,.45)}
.card.on .th{background:rgba(255,255,255,.55)}
.card.lock{opacity:.55;filter:grayscale(.75)}
.card.unl{background:linear-gradient(180deg,#fff,#e6f9ff);box-shadow:0 2px 0 #9ad4e8,0 0 14px rgba(80,190,255,.45)}
.card.unl .th img{filter:brightness(.55) saturate(.6)}
.card .new{position:absolute;top:3px;left:5px;z-index:2;font:700 9.5px var(--ui);background:#ff5d8f;color:#fff;border-radius:6px;padding:1px 5px}
.unhero{width:170px;height:170px;margin:0 auto;border-radius:40px;background:radial-gradient(circle at 50% 60%,#f4f8ea,#d9e6c4);overflow:hidden;display:grid;place-items:center;font-size:70px}
.unhero img{width:100%;height:100%;object-fit:contain}
.lex{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.lex div{background:#fff;border:1px solid #ecdfbd;border-radius:12px;padding:6px 4px;text-align:center}
.lex b{display:block;font-size:15px}.lex span{font-size:11px;opacity:.65}
.fact{margin-top:8px;font-size:13px;background:#eef6ff;border-radius:12px;padding:8px 10px;line-height:1.35}
/* ---------- Sheet ---------- */
#sheet{position:fixed;left:8px;right:8px;bottom:calc(var(--dockH) + 8px);background:var(--cream);color:var(--ink);border-radius:22px;padding:14px 14px 12px;box-shadow:0 14px 44px rgba(0,0,0,.45);display:none;max-height:58vh;overflow:auto;z-index:7;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sh-h{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding-right:32px}
.sh-ic{width:72px;height:72px;flex:0 0 72px;display:grid;place-items:center;font-size:40px;background:radial-gradient(circle at 50% 65%,#f4f8ea,#e3ead2);border-radius:20px;overflow:hidden}
.sh-ic img{width:100%;height:100%;object-fit:contain}
.sh-t{font-weight:700;font-size:20px;line-height:1.1}
.sh-s{font-size:13px;opacity:.7;margin-top:3px}
.x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:#ecdfbd;color:#5b4a2a;font-size:14px}
.meter{margin:7px 0}
.meter .lb{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.mbar{height:9px;border-radius:5px;background:#ecdfc5;overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;border-radius:5px}
.arow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:1px solid #ecdfbd;font-size:14px}
.arow .e{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;font-size:26px;border-radius:12px;background:#f2ecd9;overflow:hidden}
.arow .e img{width:100%;height:100%;object-fit:contain}
.arow .nm{flex:1;font-weight:600;line-height:1.15;min-width:0}
.arow .nm small{display:block;font-weight:500;opacity:.65;font-size:11.5px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:#ffd6e7;color:#b0306a;margin-left:4px;vertical-align:2px}
.preg{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:#e3f2ff;color:#2a6ae8;margin-left:4px;vertical-align:2px}
.sex-m{color:#2b7de9}.sex-f{color:#e0457b}
.btn{border-radius:14px;padding:10px 12px;font:600 14px var(--ui);background:#2d6a4f;color:#fff;box-shadow:0 3px 0 #1b4332}
.btn.red{background:#e05252;box-shadow:0 3px 0 #9b2c2c}
.btn.gold{background:var(--acc);color:#3a2a00;box-shadow:0 3px 0 #c98a00}
.btn.sec{background:#3d4a6b;box-shadow:0 3px 0 #252e45}
.btn.pink{background:#ff5d8f;box-shadow:0 3px 0 #b8325e}
.btn.ghost{background:transparent;box-shadow:none;color:inherit;opacity:.7}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:11px;box-shadow:0 2px 0 #9b2c2c}
.tip{font-size:13px;background:#fff1c9;border-radius:12px;padding:8px 10px;margin-top:6px;line-height:1.35}
.tip.bad{background:#ffe1e1}.tip.good{background:#dcf4e2}.tip.pink{background:#ffe4ef}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{width:48px;height:48px;border-radius:13px;background:#fff;box-shadow:0 2px 0 #e0cfa4;overflow:hidden;font-size:24px}
.chips button img{width:100%;height:100%;object-fit:contain}
.chips button.lk{opacity:.4;filter:grayscale(1)}
.sec-t{font-weight:700;font-size:12.5px;opacity:.6;margin:12px 0 2px;text-transform:uppercase;letter-spacing:.5px}
.sec-t small{text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px}
.btn.ghost{border:1.5px solid rgba(0,0,0,.18);opacity:.85;box-shadow:none}
.btn.ghost.sm{box-shadow:none}
.arow .btn.ghost.sm{flex:0 0 auto;margin-left:4px;padding:6px 9px}
.dchips{display:flex;gap:7px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dchips::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:70px;border-radius:14px;background:#fff;box-shadow:0 2px 0 #e0cfa4;padding:4px 3px 5px;display:flex;flex-direction:column;align-items:center;font:600 10.5px var(--ui);color:#4a3a1a;position:relative}
.dchip img{width:58px;height:50px;object-fit:contain}
.dchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.dchip i{font-style:normal;font-weight:500;opacity:.75;font-size:10px}
.dchip.fs{background:linear-gradient(#fff8d6,#fff);box-shadow:0 2px 0 #f0c040,0 0 0 2px #ffd23f inset}
.dchip.fh{box-shadow:0 2px 0 #b7d98a}
.plist{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.pchip{display:inline-flex;align-items:center;gap:4px;background:#efe3c3;border-radius:10px;padding:3px 4px 3px 8px;font:500 12px var(--ui)}
.pchip button{width:20px;height:20px;border-radius:7px;background:#e05252;color:#fff;font-size:11px;line-height:20px}
.btns.wrap .btn{flex:1 1 45%}
.fsep{flex:0 0 1px;background:rgba(0,0,0,.15);margin:2px 3px}
.flt.sx.on{background:#ff8fab;color:#fff}
/* ---------- Baby-Karten ---------- */
#births{position:fixed;left:8px;right:8px;bottom:calc(var(--dockH) + 58px);z-index:6;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.bcard{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-radius:18px;background:linear-gradient(135deg,#fff,#ffe4ef);color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.3);animation:bin .35s cubic-bezier(.2,1.6,.4,1);max-width:100%}
.bcard img{width:48px;height:48px;border-radius:12px;background:#ffd6e7;object-fit:contain}
.bcard .tx{font:600 13px/1.2 var(--ui)}.bcard .tx small{display:block;font-weight:500;opacity:.7;font-size:11.5px}
.bcard .btn{padding:7px 10px;font-size:12.5px;white-space:nowrap}
.bcard.out{animation:bout .3s forwards}
@keyframes bin{from{transform:translateX(-30px) scale(.8);opacity:0}}
@keyframes bout{to{transform:translateX(-30px);opacity:0}}
/* ---------- Toast & Banner ---------- */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 62px);left:50%;transform:translate(-50%,-8px);background:rgba(12,18,28,.9);color:#fff;padding:9px 16px;border-radius:15px;font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;max-width:92%;text-align:center;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.night #toast{top:calc(env(safe-area-inset-top) + 112px)}
#banner{position:fixed;top:24%;left:0;right:0;text-align:center;pointer-events:none;z-index:8;font-family:var(--mil);opacity:0;text-transform:uppercase}
#banner.show{animation:ban 2.6s ease forwards}
#banner .b1{font-size:58px;font-weight:600;letter-spacing:4px;line-height:.9;text-shadow:0 4px 20px rgba(0,0,0,.8)}
#banner .b2{font-size:22px;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.9);color:var(--acc)}
@keyframes ban{0%{opacity:0;transform:scale(1.35)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:15;background:rgba(5,10,20,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex}
.box{position:relative;background:var(--cream);color:var(--ink);border-radius:24px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.93);opacity:0}}
.box h2{font-size:23px;margin-bottom:6px}
.box h4{margin:12px 0 3px;font-size:15px}
.box p,.box li{font-size:14px;line-height:1.45}
.box ul{padding-left:18px}
.box.dark{background:linear-gradient(180deg,#1b2540,#0a0f1d);color:#e8edf5;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 24px 70px rgba(0,0,0,.6)}
.mil{font-family:var(--mil);letter-spacing:1.5px;text-transform:uppercase}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns .btn{flex:1}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 0}
.sbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:7px 9px}
.box:not(.dark) .sbox{background:#fff;border-color:#ecdfbd}
.sbox .v{font:600 28px var(--mil);line-height:1}
.sbox .l{font-size:11.5px;opacity:.7}
.xpbar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin:5px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb703,#fb8500)}
.intel{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ib{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:4px 8px 4px 4px}
.ib img{width:42px;height:42px;object-fit:contain}.ib .ic2{font:600 26px var(--mil);line-height:1}.ib .in{font-size:11.5px;opacity:.75;line-height:1.1}
.lo{margin-top:10px;font-size:13px;opacity:.9;background:rgba(255,183,3,.1);border:1px solid rgba(255,183,3,.3);border-radius:12px;padding:8px 10px;line-height:1.5}
.promo{margin:10px 0;padding:10px;border-radius:12px;background:linear-gradient(135deg,rgba(255,183,3,.25),rgba(251,133,0,.1));border:1px solid rgba(255,183,3,.5);text-align:center}
/* ---------- Nacht-HUD ---------- */
#nhud{position:fixed;inset:0;pointer-events:none;display:none;font-family:var(--mil);z-index:4}

function recompute(){
  rmap.fill(-1); regions=[];
  for(let i=0;i<N;i++){
    const t=S.tiles[i].t; if(!isHab(t)||rmap[i]>=0) continue;
    const reg={id:regions.length,t,tiles:[],decoS:0,deco:0,animals:[],care:0,fight:false};
    const q=[i]; rmap[i]=reg.id;
    while(q.length){
      const j=q.pop(), x=j%COLS, y=(j/COLS)|0; reg.tiles.push([x,y]);
      const b=S.tiles[j].b; if(b&&BLD[b].cat==='deco'){ reg.deco++; reg.decoS+=FAV[t].includes(b)?1:.5; }
      for(const[dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(!inb(nx,ny)) continue; const k=ny*COLS+nx; if(rmap[k]<0&&S.tiles[k].t===t){ rmap[k]=reg.id; q.push(k); } }
    }
    regions.push(reg);
  }
  const keep=[];
  for(const a of S.animals){
    if(a.carried){ keep.push(a); continue; }
    const sp=SP[a.sp]; const tx=Math.floor(a.x), ty=Math.floor(a.y);
    let r=inb(tx,ty)?rmap[ty*COLS+tx]:-1;
    if(r<0||regions[r].t!==sp.t){
      let best=null,bd=99;
      for(const reg of regions) if(reg.t===sp.t) for(const[x,y] of reg.tiles){ const d=Math.abs(x-tx)+Math.abs(y-ty); if(d<bd){bd=d;best=[x,y,reg.id];} }
      if(best&&bd<=3){ a.x=a.tx=best[0]+.5; a.y=a.ty=best[1]+.5; r=best[2]; }
      else { S.money+=Math.floor(sp.p/2); toast(`${sp.e} ${a.name} hatte kein Gehege mehr und wurde verkauft.`); continue; }
    }
    a.r=r; keep.push(a);
  }
  S.animals=keep;
  for(const a of S.animals) if(a.r>=0&&regions[a.r]) regions[a.r].animals.push(a);
  if(S.foods) cleanFoods();
  const care=[]; S.tiles.forEach((t,i)=>{ if(t.b&&BLD[t.b].care) care.push([i%COLS,(i/COLS)|0,BLD[t.b].care,t.b==='tierarzt'?15:10]); });
  for(const reg of regions){
    const need=reg.animals.reduce((s,a)=>s+SP[a.sp].s*(a.age<ADULT?.5:1),0);
    reg.spaceF=need?Math.min(1,reg.tiles.length/need):1;
    reg.decoF=reg.animals.length?Math.min(1,reg.decoS/Math.max(1,Math.ceil(reg.animals.length/2))):1;
    for(const[cx,cy,cr,bonus] of care) if(reg.tiles.some(([x,y])=>Math.max(Math.abs(x-cx),Math.abs(y-cy))<=cr)){ reg.care+=bonus; reg.keeper=1; }
    reg.care=Math.min(25,reg.care);
    const sps=new Set(reg.animals.map(a=>a.sp));
    reg.fight=sps.size>1&&[...sps].some(s=>SP[s].pred);
    reg.w=clamp(Math.round(25+40*reg.spaceF+25*reg.decoF+reg.care-(reg.fight?30:0)),0,100);
    const cnt={}; reg.animals.forEach(a=>cnt[a.sp]=(cnt[a.sp]||0)+1);
    const decos=new Set(); for(const[x,y] of reg.tiles){ const b=tile(x,y).b; if(b) decos.add(b); }
    reg.sw={};
    for(const id in cnt){ const X=SPX[id], n=cnt[id]; let adj=0, why=[];
      if(n<X.gmin){ adj-=12; why.push('lonely'); } else if(n>X.gmax){ adj-=10; why.push('crowd'); } else adj+=5;
      if(X.fav.some(f=>decos.has(f))){ adj+=8; why.push('fav'); }
      reg.sw[id]={w:clamp(reg.w+adj,0,100),why,n}; }
    reg.animals.forEach(a=>{ const q=reg.sw[a.sp]; a.wb=q.w; a.w=clamp(Math.round(q.w-hungerPen(a)),0,100); a.lonely=q.why.includes('lonely'); });
  }
}

}

    cam.tx=lerp(cam.tx,clamp(player.x+Math.cos(player.ang)*.7,0,COLS),Math.min(1,dt*4)); cam.tz=lerp(cam.tz,clamp(player.y+Math.sin(player.ang)*.7,0,ROWS)+.4,Math.min(1,dt*4)); }
  else if(cam.mode==='near'){ const ze=lerp(56,36,clamp((cam.nz-.6)/2.2,0,1)); cam.e=lerp(cam.e,ze*D2R,k); cam.tx=lerp(cam.tx,cam.px,Math.min(1,dt*10)); cam.tz=lerp(cam.tz,cam.pz,Math.min(1,dt*10)); }
  else { cam.z=lerp(cam.z,cam.uz,Math.min(1,dt*10)); cam.e=lerp(cam.e,74*D2R,k); cam.yawT=0; cam.tx=lerp(cam.tx,cam.px,Math.min(1,dt*10)); cam.tz=lerp(cam.tz,cam.pz,Math.min(1,dt*10)); }
  cam.yaw=angLerp(cam.yaw,cam.yawT,Math.min(1,dt*7));

}

function sellAnimal(id,quiet){
  const a=S.animals.find(o=>o.id===id); if(!a) return 0;
  const v=sellValue(a), r=a.r; earn(v,a.x,a.y,`+${fmt(v)} 💰`); S.animals.splice(S.animals.indexOf(a),1); S.st.sold++;
  for(let k=0;k<6;k++) fxCoin(a.x,.3,a.y); fxSmoke(a.x,.2,a.y,6,'#ffffff',.08);
  if(!quiet){ sfx('sell'); toast(`${SP[a.sp].e} ${a.name} wurde für 💰${fmt(v)} an einen anderen Zoo verkauft.`); }
  recompute(); refreshTools(); updateBabyBadge();
  if(quiet) return v;
  if(zooOpen) openZoo(); else if(babyOpen) openBabies(); else if(selR>=0&&regions[r]) showRegion(r); else closeSheet();
  return v;
}

  const own=S.guns.includes(selW), locked=!own&&W[selW].r>rankOf(S.xp);
  const ctx=pv.getContext('2d'); renderObj(armObj,pv.width,pv.height,[Math.sin(armAng)*.95,.3+Math.sin(armAng*.7)*.05,Math.cos(armAng)],ctx,18*D2R,.56);
  if(locked){ ctx.globalCompositeOperation='source-atop'; ctx.fillStyle='rgba(10,14,24,.85)'; ctx.fillRect(0,0,pv.width,pv.height); ctx.globalCompositeOperation='source-over'; }
}
function armBody(){
  const rank=rankOf(S.xp);
  if(armTab==='perks') return `<div class="ptxt">Wähle bis zu 3 aktive Perks. Gekaufte Perks kannst du jederzeit tauschen.</div>`+Object.entries(PERKS).map(([id,p])=>{
    const own=S.perks.includes(id), eq=S.peq.includes(id), lk=!own&&p.r>rank;
    return `<div class="perk ${eq?'on':''} ${lk?'lk':''}"><div class="pe">${p.e}</div><div class="grow"><div class="pn">${p.n}</div><div class="pd">${p.d}</div></div>${lk?`<span class="plk">🔒 Rang ${p.r}</span>`:own?`<button class="abtn sm ${eq?'':'sec'}" onclick="togglePerk('${id}')">${eq?'✓ Aktiv':'Aktivieren'}</button>`:`<button class="abtn sm" onclick="buyPerk('${id}')" ${S.money<p.p?'disabled':''}>💰 ${fmt(p.p)}</button>`}</div>`; }).join('');
  if(armTab==='ausr'){
    const items=[['nades','💣','Granaten',`${S.nades} pro Nacht · Flächenschaden`,S.nades,6,400*S.nades],['meds','💉','Medikits',`${S.meds} pro Nacht · +70 Leben`,S.meds,4,500*S.meds],['vest','🦺','Schutzweste',`Stufe ${S.vest} · +${S.vest*50} Leben`,S.vest,3,900*(S.vest+1)]];
    return `<div class="ptxt">Ausrüstung wird jede Nacht aufgefüllt. Wachtürme, Minen und Hunde findest du im Bau-Menü unter 🛡️ Abwehr.</div>`+items.map(([id,e,n,d,v,max,price])=>`<div class="perk"><div class="pe">${e}</div><div class="grow"><div class="pn">${n}</div><div class="pd">${d}</div></div>${v>=max?'<span class="plk">MAX</span>':`<button class="abtn sm" onclick="buyEquip('${id}')" ${S.money<price?'disabled':''}>+1 · 💰${fmt(price)}</button>`}</div>`).join('');
  }
  const list=Object.keys(W).filter(id=>W[id].c===armTab); if(!list.includes(selW)) selW=list[0];
  const w=W[selW], own=S.guns.includes(selW), locked=!own&&w.r>rank, g=gunStats(selW);
  const cmpId=S.lo.p===selW?S.lo.s:S.lo.p, cmp=cmpId?gunStats(cmpId):null;
  const stats=STATS.map(([lb,f,val])=>{ const v=clamp(f(g),0,1), c=cmp?clamp(f(cmp),0,1):v, lo=Math.min(v,c);
    return `<div class="row"><span>${lb}</span><div class="sbar"><i style="left:0;width:${lo*100}%;background:#e8edf5"></i>${v>c?`<i style="left:${c*100}%;width:${(v-c)*100}%;background:#4ade80"></i>`:''}${v<c?`<i style="left:${v*100}%;width:${(c-v)*100}%;background:#f87171"></i>`:''}</div><span class="n">${val(g)}</span></div>`; }).join('');
  const tags=[g.pel?`${g.pel} Schrot`:'',g.pierce?`Durchschlag ×${g.pierce}`:'',g.splash&&!g.stun?'Explosiv':'',g.stun?'Netz · Betäubt 3s':'',g.tranq?'Festnahme +50%':'',g.spin?'Anlaufzeit':'',g.glow?'Legendär':''].filter(Boolean);
  const kills=S.wk[selW]||0, lvl=wLevel(selW), nextC=CAMOS.find(c=>c[2]>kills);
  const camos=own?`<div class="camos">${CAMOS.map(([cid,cn,k])=>{ const ok=kills>=k; return `<div class="camo ${(S.camo[selW]||'std')===cid?'on':''} ${ok?'':'lk'}" style="background-image:url(${camoURL(cid)})" onclick="${ok?`setCamo('${selW}','${cid}')`:`toast('Tarnung „${cn}“: ${k} Abschüsse mit dieser Waffe')`}"><span>${ok?cn:'🔒 '+k}</span></div>`; }).join('')}</div>`:'';
  let btns;
  if(locked) btns=`<button class="abtn" disabled>🔒 Ab Rang ${w.r} · ${RN[w.r-1]}</button>`;
  else if(!own) btns=`<button class="abtn" onclick="buyWeapon('${selW}')" ${S.money<w.p?'disabled':''}>Kaufen · 💰 ${fmt(w.p)}</button>`;
  else btns=`<button class="abtn ${S.lo.p===selW?'':'sec'}" onclick="equip('${selW}','p')">${S.lo.p===selW?'✓ Primär':'Als Primär'}</button><button class="abtn ${S.lo.s===selW?'':'sec'}" onclick="equip('${selW}','s')">${S.lo.s===selW?'✓ Sekundär':'Als Sekundär'}</button>`;
  const catN=WCAT.find(c=>c[0]===armTab)[1];
  return `<div class="preview"><div class="ptop"><span>${catN}</span><span>${own?(S.lo.p===selW?'★ PRIMÄR':S.lo.s===selW?'★ SEKUNDÄR':'IM BESITZ'):locked?'🔒 GESPERRT':'ZU KAUFEN'}</span></div>
    <canvas id="gunPv"></canvas><div class="pvhint">⟲ ZIEHEN ZUM DREHEN</div>
    <div class="wname">${w.n}</div><div class="wdesc">${w.d}</div>
    ${own?`<div class="wlvl">Stufe ${lvl}/5 · ${kills} Abschüsse${nextC?` · „${nextC[1]}“ bei ${nextC[2]}`:' · Alle Tarnungen!'}</div>`:''}
    <div class="stats">${stats}</div>
    ${tags.length?`<div class="tags">${tags.map(t=>`<span>${t}</span>`).join('')}</div>`:''}
    ${camos}<div class="abtns">${btns}</div>
    ${cmp&&cmpId!==selW?`<div class="cmpnote">Grün/Rot = Vergleich mit ${W[cmpId].n}</div>`:''}</div>
  <div class="wlist">${list.map(id=>{ const ww=W[id], o=S.guns.includes(id), lk=!o&&ww.r>rank, eq=S.lo.p===id?'1':S.lo.s===id?'2':'';
    return `<div class="witem ${id===selW?'on':''} ${lk?'lk':''}" onclick="armSel('${id}')">${eq?`<span class="eq">${eq==='1'?'PRIMÄR':'SEKUNDÄR'}</span>`:''}<div class="wth">${thumbImg('g:'+id+':'+(S.camo[id]||'std'),'🔫')}${lk?'<span class="lkI">🔒</span>':''}</div><div class="nm">${ww.n}</div><div class="st">${o?'Im Besitz · Stufe '+wLevel(id):lk?'🔒 Rang '+ww.r:'💰 '+fmt(ww.p)}</div></div>`; }).join('')}</div>`;
}
function buyWeapon(id){ const w=W[id]; if(S.guns.includes(id)) return; if(w.r>rankOf(S.xp)){ toast(`Erst ab Rang ${w.r}`); return; } if(!spend(w.p)) return; S.guns.push(id); S.camo[id]='std'; sfx('build'); toast(`🔫 ${w.n} gekauft!`); if(!S.lo.s) S.lo.s=id; save(); renderArmory(); }
function equip(id,slot){
  if(slot==='p'){ if(S.lo.p===id) return; if(S.lo.s===id) S.lo.s=S.lo.p; else if(!S.lo.s) S.lo.s=S.lo.p; S.lo.p=id; }
  else { if(S.lo.p===id){ if(!S.lo.s) return toast('Das ist schon deine Primärwaffe'); const o=S.lo.s; S.lo.s=id; S.lo.p=o; } else S.lo.s=id; }
  sfx('reload'); save(); renderArmory();
}
function setCamo(id,c){ S.camo[id]=c; save(); renderArmory(); }
function buyPerk(id){ const p=PERKS[id]; if(p.r>rankOf(S.xp)) return; if(!spend(p.p)) return; S.perks.push(id); if(S.peq.length<3) S.peq.push(id); sfx('build'); save(); renderArmory(); }
function togglePerk(id){ const i=S.peq.indexOf(id); if(i>=0) S.peq.splice(i,1); else { if(S.peq.length>=3){ toast('Nur 3 Perks gleichzeitig – deaktiviere erst einen.'); return; } S.peq.push(id); } save(); renderArmory(); }
function buyEquip(id){ const price=id==='nades'?400*S.nades:id==='meds'?500*S.meds:900*(S.vest+1); const max={nades:6,meds:4,vest:3}[id]; if(S[id]>=max) return; if(!spend(price)) return; S[id]++; sfx('build'); save(); renderArmory(); }
// =====================================================================
//  HUD
// =====================================================================
let toastT=0;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); toastT=3.2; }
function showBanner(a,b){ const el=$('banner'); el.innerHTML=`<div class="b1">${a}</div>${b?`<div class="b2">${b}</div>`:''}`; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function killFeed(wn,en,tranq){ const f=$('kfeed'); while(f.children.length>=4) f.firstChild.remove(); const el=document.createElement('div'); el.className='kf'; el.innerHTML=`<span class="kw">${wn}</span> ${tranq?'💤':'✖'} <span class="ke">${en}</span>`; f.appendChild(el); setTimeout(()=>el.remove(),4000); }
function scorePop(label,pts){ $('score').innerHTML=`<div class="sp"><b>${pts}</b><span>${label}</span></div>`; }
function updateStreakUI(){ if(!night){ $('streak').innerHTML=''; $('stk').textContent=''; return; }
  $('streak').innerHTML=(night.ksHeli?`<button class="ks" onpointerdown="event.stopPropagation();callHeli()">🚁 HELI</button>`:'')+(night.ksAir?`<button class="ks" onpointerdown="event.stopPropagation();callAir()">✈️ LUFTSCHLAG</button>`:'');
  $('stk').textContent=night.streak>=2?`🔥 SERIE ${night.streak}${night.streak<4?' · HELI BEI 4':night.streak<8?' · LUFTSCHLAG BEI 8':''}`:''; }
let lastMoney=0;
function hud(){
  $('hMoney').textContent=fmt(S.money); $('cMoney').classList.toggle('neg',S.money<0);
  if(S.money>lastMoney+20){ const c=$('cMoney'); c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); } lastMoney=S.money;
  $('hInc').textContent=`+${fmt(incomeRate())} /min`;
  $('hRate').textContent='⭐ '+ratingC.toFixed(1);
  if(S.phase==='day'){ $('hDay').textContent=`Tag ${S.day}`; $('dayIc').textContent=S.dayT>DAY_LEN-15?'🌆':'☀️'; $('dayRing').style.setProperty('--p',(S.dayT/DAY_LEN*100)+'%'); $('bSpeed').textContent=speed===0?'⏸ Pause':speed===1?'▶ 1×':'⏩ 3×'; }
  else if(night&&player){
    const left=night.queue.length+enemies.length; $('hDay').textContent=`Nacht ${night.n}`; $('hRate').textContent=`🥷 ${left} · 🐾 ${S.animals.length}`; $('dayIc').textContent='🌙'; $('dayRing').style.setProperty('--p',((1-left/Math.max(1,night.total))*100)+'%');
    const p=player, gid=curGun(), g=gunStats(gid);
    $('hpI').style.width=clamp(p.hp/p.max,0,1)*100+'%'; $('hpI').style.background=p.hp/p.max<.35?'linear-gradient(90deg,#e63946,#ff6b6b)':''; $('hpT').textContent=Math.max(0,Math.ceil(p.hp));
    $('amN').innerHTML=p.rel>0?'<span class="rl">LÄDT NACH…</span>':`${p.ammo[gid]}<small> / ${g.mag}</small>`;
    $('amW').textContent=W[gid].n+(g.spin&&p.spin<.55&&fire?' · läuft an…':'');
    $('relI').style.width=p.rel>0?(1-p.rel/p.relMax)*100+'%':'0';
    $('nadeN').textContent=night.nades; $('medN').textContent=night.meds;
    $('swapN').textContent=S.lo.s?W[p.slot==='p'?S.lo.s:S.lo.p].n.split(' ')[0]:'—';
    $('hurt').style.opacity=p.hurt;
  }
}
// =====================================================================
//  HAUPTSCHLEIFE
// =====================================================================
let last=performance.now(), hudT=0, ratT=0, toolT=0, saveT=0, breedAcc=0;
function loop(now){
  const raw=Math.min(.05,Math.max(0,(now-last)/1000)); last=now; time+=raw;
  try{
    if(!isPaused()){
      if(S.phase==='day'){
        const dt=raw*speed;
        if(speed>0){
          S.dayT+=dt; spawnT-=dt;
          if(spawnT<=0){ if(guests.length<45) spawnGuest(); spawnT=clamp(5/ratingC,.4,6); }
          updateGuests(dt); updateAnimals(dt); updateFood(dt); breedAcc+=dt; if(breedAcc>.5){ dayBirths(); breedAcc=0; }
          if(S.dayT>=DAY_LEN){ S.dayT=DAY_LEN; openDusk(); }
        }
      } else if(night){ updateAnimals(raw); updateNight(raw); }
    }
    if(toastT>0){ toastT-=raw; if(toastT<=0) $('toast').classList.remove('on'); }
    ratT-=raw; if(ratT<=0){ ratingC=rating(); ratT=.5; updateBabyBadge(); checkUnlockNews(); }
    hudT-=raw; if(hudT<=0){ hud(); hudT=.12; }
    toolT-=raw; if(toolT<=0){ refreshTools(); toolT=1; }
    saveT-=raw; if(saveT<=0){ if(S.phase==='day') save(); saveT=15; }
    if($('armory').classList.contains('on')) armoryFrame(raw);
    else frame3D(isPaused()?0:raw*(S.phase==='day'?Math.max(speed,.0001):1));
    processThumbs();
    if(!fpsChecked&&time>3){ fpsAcc+=raw; fpsN++; if(fpsN>=240){ fpsChecked=true; const fps=fpsN/fpsAcc; if(fps<24&&Q.hi){ setQuality(false); toast('🎨 Grafik auf „Schnell“ gestellt, damit es flüssig läuft.'); } } }
  }catch(err){ console.error(err); }
  requestAnimationFrame(loop);
}
function updateViewBtns(){ $('bView').textContent=cam.mode==='near'?'🦅 Oben':'🏞️ Nah'; $('rctl').style.display=cam.mode==='near'?'flex':'none'; }
$('bView').onclick=()=>{ setCamMode(cam.mode==='near'?'bird':'near'); toast(cam.mode==='near'?'🦅 Vogelansicht – der ganze Zoo von oben':'🏞️ Nahansicht · 2 Finger: zoomen & drehen · ⟲ ⟳ drehen'); };
$('bRotL').onclick=()=>rotCam(-1); $('bRotR').onclick=()=>rotCam(1);
$('bSpeed').onclick=()=>{ speed=speed===1?3:speed===3?0:1; hud(); };
$('bNight').onclick=()=>openDusk();
$('bArm').onclick=()=>{ if(S.phase==='night'){ toast('Die Waffenkammer ist nur tagsüber offen.'); return; } openArmory(); };
$('bZoo').onclick=()=>openZoo();
$('bBaby').onclick=()=>openBabies();
$('bMenu').onclick=()=>openMenu();
$('modal').addEventListener('pointerdown',e=>{ if(e.target===$('modal')&&S.phase==='day'&&!$('mbox').innerHTML.includes('Aufklärung')&&!$('mbox').innerHTML.includes('Einsatzbericht')) closeModal(); });
const tapBtn=(id,fn)=>$(id).addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); ac(); fn(); });
tapBtn('bSwap',swapGun); tapBtn('bRel',reload); tapBtn('bNade',throwNade); tapBtn('bMed',useMed);
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.phase==='day') save(); });
window.addEventListener('resize',()=>{ resize(); });
function start(){ document.body.classList.toggle('pp',Q.hi);
  if(!engInit(cv,Q.hi)){ $('loading').innerHTML='<div style="text-align:center;padding:20px">😕 Dein Browser unterstützt kein WebGL2.<small>Bitte aktualisiere deinen Browser (Chrome, Safari ab iOS 15).</small></div>'; return; }
  initPrims(); initMats(); initAtlas(); initTextures(); initScene();
  const firstRun=!load(); if(firstRun) newGame();
  cur=TABS[0].items()[0]; curKey='info:'; ratingC=rating();
  renderBottom(); resize(); tDirty=bDirty=true; updateBabyBadge(); updateViewBtns();
  requestAnimationFrame(t=>{ last=t; loop(t); });
  setTimeout(()=>{ $('loading').style.opacity=0; setTimeout(()=>$('loading').remove(),400); },300);
  if(firstRun) openHelp();
}
start();

</script>
