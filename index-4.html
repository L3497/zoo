<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f4d3a">
<title>Zoo Wächter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g1:#1f4d3a;--g2:#2d6a4f;--g3:#40916c;--cream:#fff8e7;--ink:#24302a;--acc:#ffb703;--acc2:#fb8500;--red:#e63946;
  --ui:'Fredoka',system-ui,-apple-system,"Segoe UI",sans-serif;--mil:'Teko','Fredoka',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ui);color:#fff;background:radial-gradient(circle at 50% 25%,#3a7d5c,#143426 72%);transition:background .8s}
body.night{background:radial-gradient(circle at 50% 25%,#1d2a4d,#05080f 72%)}
button{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
#top{display:flex;gap:6px;align-items:center;padding:8px 10px 6px}
.chip{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);padding:5px 9px;border-radius:999px;font-weight:600;font-size:13.5px;min-width:0;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.chip.neg{color:#ff8a8a}
.grow{flex:1}
.ibtn{width:34px;height:34px;flex:0 0 34px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:18px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ibtn:active,.card:active,.btn:active,.nb:active{transform:scale(.93)}
#dayBar{height:4px;margin:0 12px 6px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#dayI{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#f77f00);transition:width .2s}
body.night #dayI{background:linear-gradient(90deg,#4cc9f0,#7b2cbf)}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#cv{touch-action:none;display:block;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.08)}
#sbtns{position:absolute;top:6px;right:10px;display:flex;gap:6px;z-index:3}
body.night #sbtns{display:none}
.pill{border:0;border-radius:999px;padding:6px 12px;font:600 13px var(--ui);background:rgba(10,20,40,.6);color:#fff;backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pill.moon{background:linear-gradient(135deg,#4a5bb0,#1d2650)}
/* Unten */
#bottom{background:linear-gradient(180deg,#fffaf0,#f4e8c9);color:var(--ink);border-radius:22px 22px 0 0;padding:9px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.28)}
#tabs,#filters,#tools{display:flex;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar,#filters::-webkit-scrollbar,#tools::-webkit-scrollbar,.acats::-webkit-scrollbar,.camos::-webkit-scrollbar{display:none}
#tabs{gap:6px;padding:0 10px 7px}
.tab{flex:0 0 auto;border:0;border-radius:999px;padding:6px 12px;background:#ecdfbd;color:#5b4a2a;font:600 13px var(--ui)}
.tab.on{background:var(--g2);color:#fff;box-shadow:0 2px 0 #1b4332}
#filters{gap:5px;padding:0 10px 7px}
.flt{flex:0 0 auto;border:0;border-radius:10px;padding:3px 9px;background:#f0e5c7;font:500 12.5px var(--ui);color:#5b4a2a}
.flt.on{background:var(--acc);color:#3a2a00}
#tools{gap:8px;padding:2px 10px 4px}
.card{position:relative;flex:0 0 auto;width:78px;padding:7px 4px 6px;border-radius:16px;background:#fff;box-shadow:0 2px 0 #e0cfa4,0 3px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.15;color:var(--ink);transition:transform .1s}
.card .ic{font-size:29px;line-height:1.15;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.card .pr{font-size:11px;font-weight:600;color:var(--g2);margin-top:1px}
.card .tag{position:absolute;top:3px;right:5px;font-size:11px}
.card.on{background:linear-gradient(180deg,#ffd166,#ffb703);box-shadow:0 2px 0 #c98a00,0 4px 12px rgba(255,183,3,.45)}
.card.lock{opacity:.5;filter:grayscale(.6)}
.card.poor .pr{color:var(--red)}
/* Toast & Banner */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 62px);left:50%;transform:translate(-50%,-8px);background:rgba(15,20,30,.9);color:#fff;padding:9px 15px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;max-width:92%;text-align:center;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#banner{position:absolute;top:28%;left:0;right:0;text-align:center;pointer-events:none;z-index:7;font-family:var(--mil);opacity:0;text-transform:uppercase}
#banner.show{animation:ban 2.6s ease forwards}
#banner .b1{font-size:56px;font-weight:600;letter-spacing:4px;line-height:.9;text-shadow:0 4px 20px rgba(0,0,0,.8)}
#banner .b2{font-size:21px;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
@keyframes ban{0%{opacity:0;transform:scale(1.35)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
/* Sheet */
#sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--cream);color:var(--ink);border-radius:20px;padding:14px 14px 12px;box-shadow:0 10px 40px rgba(0,0,0,.45);display:none;max-height:66%;overflow:auto;z-index:6;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sh-h{display:flex;align-items:center;gap:11px;margin-bottom:8px;padding-right:30px}
.sh-ic{font-size:38px;width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center;background:linear-gradient(180deg,#f7ecd0,#ecdcb3);border-radius:17px}
.sh-t{font-weight:700;font-size:19px;line-height:1.1}
.sh-s{font-size:13px;opacity:.7;margin-top:2px}
.x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:0;background:#ecdfbd;color:#5b4a2a;font-size:14px}
.meter{margin:7px 0}
.meter .lb{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.mbar{height:9px;border-radius:5px;background:#ecdfc5;overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;border-radius:5px}
.arow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid #ecdfbd;font-size:14px}
.arow .e{font-size:27px;width:34px;text-align:center}
.arow .nm{flex:1;font-weight:600;line-height:1.15}
.arow .nm small{display:block;font-weight:500;opacity:.65;font-size:11.5px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:#ffd6e7;color:#b0306a;margin-left:4px;vertical-align:2px}
.sex-m{color:#2b7de9}.sex-f{color:#e0457b}
.btn{border:0;border-radius:13px;padding:9px 12px;font:600 14px var(--ui);background:var(--g2);color:#fff;box-shadow:0 3px 0 #1b4332}
.btn.red{background:#e05252;box-shadow:0 3px 0 #9b2c2c}
.btn.gold{background:var(--acc);color:#3a2a00;box-shadow:0 3px 0 #c98a00}
.btn.sec{background:#3d4a6b;box-shadow:0 3px 0 #252e45}
.btn.ghost{background:transparent;box-shadow:none;color:inherit;opacity:.7}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:10px;box-shadow:0 2px 0 #9b2c2c}
.tip{font-size:13px;background:#fff1c9;border-radius:11px;padding:7px 10px;margin-top:6px;line-height:1.35}
.tip.bad{background:#ffe1e1}.tip.good{background:#dcf4e2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:0;background:#fff;border-radius:12px;padding:4px 8px;font-size:22px;box-shadow:0 2px 0 #e0cfa4}
.chips button.lk{opacity:.4}
.sec-t{font-weight:700;font-size:13px;opacity:.6;margin:12px 0 2px;text-transform:uppercase;letter-spacing:.5px}
/* Modal */
.modal{position:fixed;inset:0;z-index:15;background:rgba(5,10,20,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex}
.box{position:relative;background:var(--cream);color:var(--ink);border-radius:22px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.93);opacity:0}}
.box h2{font-size:23px;margin-bottom:6px}
.box h4{margin:12px 0 3px;font-size:15px}
.box p,.box li{font-size:14px;line-height:1.45}
.box ul{padding-left:18px}
.box.dark{background:linear-gradient(180deg,#1b2540,#0a0f1d);color:#e8edf5;border:1px solid rgba(255,255,255,.12)}
.mil{font-family:var(--mil);letter-spacing:1.5px;text-transform:uppercase}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns .btn{flex:1}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 0}
.sbox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 9px}
.box:not(.dark) .sbox{background:#fff;border-color:#ecdfbd}
.sbox .v{font:600 28px var(--mil);line-height:1}
.sbox .l{font-size:11.5px;opacity:.7}
.xpbar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin:5px 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb703,#fb8500)}
.intel{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ib{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 8px}
.ib .ie{font-size:26px}.ib .ic2{font-size:24px;line-height:1}.ib .in{font-size:12px;opacity:.75;line-height:1.1}
.lo{margin-top:10px;font-size:13px;opacity:.85;background:rgba(255,183,3,.1);border:1px solid rgba(255,183,3,.3);border-radius:10px;padding:8px 10px;line-height:1.5}
.promo{margin:10px 0;padding:10px;border-radius:12px;background:linear-gradient(135deg,rgba(255,183,3,.25),rgba(251,133,0,.1));border:1px solid rgba(255,183,3,.5);text-align:center}
.babies{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.babies span{background:rgba(255,214,231,.15);border:1px solid rgba(255,150,190,.4);border-radius:10px;padding:4px 8px;font-size:13px}
/* Nacht-HUD */
#nhud{position:absolute;inset:0;pointer-events:none;display:none;font-family:var(--mil);z-index:4}
body.night #nhud{display:block}
#hp{position:absolute;left:12px;top:8px;width:46%}
#hp .lb{display:flex;justify-content:space-between;font-size:17px;letter-spacing:1px;text-shadow:0 2px 4px #000;line-height:1}
#hp .bar{height:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:3px;overflow:hidden;transform:skewX(-12deg)}
#hpI{display:block;height:100%;background:linear-gradient(90deg,#2ecc71,#a3e635);transition:width .15s}
#ammo{position:absolute;right:12px;bottom:10px;text-align:right;text-shadow:0 2px 8px rgba(0,0,0,.9)}
#amN{font-size:46px;font-weight:600;line-height:.85}
#amN small{font-size:22px;opacity:.7}
#amN .rl{font-size:26px;color:var(--acc)}
#amW{font-size:19px;letter-spacing:1.5px;text-transform:uppercase;opacity:.9}
#relBar{height:4px;background:rgba(255,255,255,.2);margin-top:3px;border-radius:2px;overflow:hidden}
#relI{display:block;height:100%;width:0;background:var(--acc)}
#nbtns{position:absolute;right:10px;top:44px;display:flex;flex-direction:column;gap:18px;pointer-events:auto}
.nb{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(10,15,30,.6);backdrop-filter:blur(4px);color:#fff;font-size:22px;position:relative;display:grid;place-items:center}
.nb b{position:absolute;right:-3px;bottom:-3px;background:var(--acc);color:#1a1200;border-radius:9px;font:600 15px var(--mil);padding:0 6px;line-height:1.3}
.nb small{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font:500 12px var(--mil);letter-spacing:1px;white-space:nowrap;text-shadow:0 1px 3px #000}
#hurt{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(220,0,0,.75));border-radius:16px}
#ctrl{position:absolute;left:0;right:0;bottom:30%;display:flex;justify-content:space-around;font-size:22px;letter-spacing:2px;opacity:0;transition:opacity 1s;text-shadow:0 2px 6px #000}
#ctrl.on{opacity:.95}
/* Waffenkammer */
#armory{position:fixed;inset:0;z-index:25;background:radial-gradient(ellipse at 50% -10%,#2b3c63,#070b14 65%);color:#e8edf5;font-family:var(--mil);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#armory.on{display:flex}
.ahead{display:flex;align-items:center;gap:10px;padding:10px 14px 2px}
.asub{font-size:14px;letter-spacing:3px;color:var(--acc);line-height:1}
.ahead>div:first-child{min-width:0}
.ahead h1{font-size:clamp(22px,7vw,32px);letter-spacing:2px!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;letter-spacing:3px;line-height:.95}
.amoney{white-space:nowrap;font-size:20px;background:rgba(255,255,255,.07);border-radius:6px;padding:2px 10px}
.aclose{width:38px;height:38px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:8px;font-size:18px}
.arank{display:flex;gap:10px;align-items:center;padding:4px 14px 6px}
.rk{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;font-size:28px;font-weight:600;color:#1a1200;background:linear-gradient(135deg,#ffd166,#f77f00);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.rn{font-size:20px;letter-spacing:1.5px;line-height:1}
.rx{font-size:14px;opacity:.6;letter-spacing:1px;line-height:1}
.loadout{display:flex;gap:6px;padding:3px 12px}
.slot{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--acc);border-radius:4px;padding:3px 8px}
.slot .l{font-size:13px;opacity:.55;letter-spacing:1.5px;line-height:1.1}
.slot .v{font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.acats{display:flex;gap:2px;overflow-x:auto;padding:8px 10px 0;border-bottom:1px solid rgba(255,255,255,.12);scrollbar-width:none}
.acat{flex:0 0 auto;background:none;border:0;color:#8fa0bb;font:500 20px var(--mil);letter-spacing:1.5px;padding:2px 10px 3px;border-bottom:3px solid transparent;text-transform:uppercase}
.acat.on{color:#fff;border-color:var(--acc)}
.abody{flex:1;overflow:auto;padding:10px 12px calc(20px + env(safe-area-inset-bottom))}
.preview{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;position:relative;overflow:hidden}
.preview:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 24px),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 24px);pointer-events:none}
.ptop{display:flex;justify-content:space-between;font-size:15px;letter-spacing:2px;opacity:.7}
.preview canvas.big{width:100%;height:130px;display:block;margin:2px 0}
.wname{font-size:34px;line-height:.9;letter-spacing:1.5px;text-transform:uppercase}
.wdesc{font-family:var(--ui);font-size:13px;opacity:.75;margin:3px 0 6px}
.wlvl{font-size:15px;letter-spacing:1px;color:var(--acc);margin-bottom:6px}
.stats .row span:first-child{white-space:nowrap;overflow:hidden}
.stats .row{display:grid;grid-template-columns:104px 1fr 46px;align-items:center;gap:8px;font-size:17px;letter-spacing:.8px;text-transform:uppercase;line-height:1.35}
.stats .row .n{text-align:right;opacity:.85}
.sbar{height:7px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;transform:skewX(-15deg)}
.sbar i{position:absolute;top:0;bottom:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 2px}
.tags span{font-size:15px;letter-spacing:1px;background:rgba(255,183,3,.15);color:var(--acc);border:1px solid rgba(255,183,3,.35);padding:0 7px;border-radius:3px;text-transform:uppercase}
.camos{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.camo{flex:0 0 auto;width:58px;height:46px;border-radius:6px;border:2px solid rgba(255,255,255,.18);background-size:cover;position:relative;display:flex;align-items:flex-end;justify-content:center}
.camo span{font-size:12px;letter-spacing:.5px;background:rgba(0,0,0,.6);width:100%;text-align:center;line-height:1.3}
.camo.on{border-color:var(--acc);box-shadow:0 0 12px rgba(255,183,3,.5)}
.camo.lk{filter:grayscale(1) brightness(.5)}
.abtns{display:flex;gap:8px;margin:10px 0 2px}
.abtn{flex:1;border:0;padding:9px 6px 6px;font:600 21px var(--mil);letter-spacing:1.5px;text-transform:uppercase;background:var(--acc);color:#1a1200;border-radius:4px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.abtn.sec{background:rgba(255,255,255,.14);color:#fff}
.abtn.sm{flex:0 0 auto;font-size:17px;padding:6px 14px 4px}
.abtn:disabled{opacity:.35}
.cmpnote{font-size:14px;opacity:.55;letter-spacing:1px;margin-top:4px}
.wlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.witem{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:6px 8px;position:relative}
.witem.on{border-color:var(--acc);background:rgba(255,183,3,.09)}
.witem.lk{opacity:.55}
.witem canvas{width:100%;height:46px;display:block}
.witem .nm{font-size:18px;line-height:1;text-transform:uppercase;letter-spacing:.5px}
.witem .st{font-size:14px;opacity:.65;letter-spacing:.5px}
.witem .eq{position:absolute;top:4px;right:5px;font-size:13px;background:var(--acc);color:#111;padding:0 5px;border-radius:2px;letter-spacing:1px}
.ptxt{font-family:var(--ui);font-size:13px;opacity:.7;margin-bottom:8px}
.perk{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:8px 10px;margin-bottom:7px}
.perk.on{border-color:var(--acc);background:rgba(255,183,3,.09)}
.perk.lk{opacity:.5}
.perk .grow{min-width:0}
.perk .pe{font-size:30px;width:40px;text-align:center}
.perk .pn{font-size:21px;letter-spacing:1px;line-height:1;text-transform:uppercase}
.perk .pd{font-family:var(--ui);font-size:12.5px;opacity:.7}
.perk .plk{font-size:16px;opacity:.7;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="chip" id="cMoney">💰 <span id="hMoney">0</span></div>
    <div class="chip">⭐ <span id="hRate">0</span></div>
    <div class="chip"><span id="hDay">☀️ Tag 1</span></div>
    <div class="grow"></div>
    <button class="ibtn" id="bZoo" aria-label="Zoo-Übersicht">📋</button>
    <button class="ibtn" id="bArm" aria-label="Waffenkammer">🔫</button>
    <button class="ibtn" id="bMenu" aria-label="Menü">☰</button>
  </div>
  <div id="dayBar"><i id="dayI"></i></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="sbtns"><button class="pill" id="bSpeed">▶ 1×</button><button class="pill moon" id="bNight">🌙 Nacht</button></div>
    <div id="nhud">
      <div id="hurt"></div>
      <div id="hp"><div class="lb"><span>RANGER</span><span id="hpT">100</span></div><div class="bar"><i id="hpI"></i></div></div>

function defaults(){ return {v:2,phase:'day',money:6000,day:1,dayT:0,tiles:[],animals:[],happy:.55,xp:0,nid:1,

function recompute(){
  rmap.fill(-1); regions=[];
  for(let i=0;i<N;i++){
    const t=S.tiles[i].t; if(!isHab(t)||rmap[i]>=0) continue;
    const reg={id:regions.length,t,tiles:[],decoS:0,deco:0,animals:[],care:0,fight:false};
    const q=[i]; rmap[i]=reg.id;
    while(q.length){
      const j=q.pop(), x=j%COLS, y=(j/COLS)|0; reg.tiles.push([x,y]);
      const b=S.tiles[j].b; if(b&&BLD[b].cat==='deco'){ reg.deco++; reg.decoS+=FAV[t].includes(b)?1:.5; }
      for(const[dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx,ny=y+dy; if(!inb(nx,ny)) continue; const k=ny*COLS+nx; if(rmap[k]<0&&S.tiles[k].t===t){ rmap[k]=reg.id; q.push(k); } }
    }
    regions.push(reg);
  }
  // Tiere prüfen
  const keep=[];
  for(const a of S.animals){
    if(a.carried){ keep.push(a); continue; }
    const sp=SP[a.sp]; const tx=Math.floor(a.x), ty=Math.floor(a.y);
    let r=inb(tx,ty)?rmap[ty*COLS+tx]:-1;
    if(r<0||regions[r].t!==sp.t){
      let best=null,bd=99;
      for(const reg of regions) if(reg.t===sp.t) for(const[x,y] of reg.tiles){ const d=Math.abs(x-tx)+Math.abs(y-ty); if(d<bd){bd=d;best=[x,y,reg.id];} }
      if(best&&bd<=3){ a.x=a.tx=best[0]+.5; a.y=a.ty=best[1]+.5; r=best[2]; }
      else { S.money+=Math.floor(sp.p/2); toast(`${sp.e} ${a.name} hatte kein Gehege mehr und wurde verkauft.`); continue; }
    }
    a.r=r; keep.push(a);
  }
  S.animals=keep;
  for(const a of S.animals) if(a.r>=0&&regions[a.r]) regions[a.r].animals.push(a);
  const care=[]; S.tiles.forEach((t,i)=>{ if(t.b&&BLD[t.b].care) care.push([i%COLS,(i/COLS)|0,BLD[t.b].care,t.b==='tierarzt'?15:10]); });
  for(const reg of regions){
    const need=reg.animals.reduce((s,a)=>s+SP[a.sp].s*(a.age<3?.5:1),0);
    reg.spaceF=need?Math.min(1,reg.tiles.length/need):1;
    reg.decoF=reg.animals.length?Math.min(1,reg.decoS/Math.max(1,Math.ceil(reg.animals.length/2))):1;
    for(const[cx,cy,cr,bonus] of care) if(reg.tiles.some(([x,y])=>Math.max(Math.abs(x-cx),Math.abs(y-cy))<=cr)) reg.care+=bonus;
    reg.care=Math.min(25,reg.care);
    const sps=new Set(reg.animals.map(a=>a.sp));
    reg.fight=sps.size>1&&[...sps].some(s=>SP[s].pred);
    const w=clamp(Math.round(25+40*reg.spaceF+25*reg.decoF+reg.care-(reg.fight?30:0)),0,100);
    reg.w=w; reg.animals.forEach(a=>a.w=w);
  }
  waterTiles=[]; S.tiles.forEach((t,i)=>{ if(t.t==='wasser') waterTiles.push([i%COLS,(i/COLS)|0,hash(i%COLS,(i/COLS)|0,77)]); });
  refreshLights();
}
function refreshLights(){
  lightsStatic=[{x:GX+.5,y:GY-.1,r:1.9,warm:1}];
  S.tiles.forEach((t,i)=>{ if(!t.b) return; const x=i%COLS+.5,y=((i/COLS)|0)+.5, b=t.b;
    if(b==='laterne') lightsStatic.push({x,y,r:2.1,warm:1});
    else if(b==='scheinw') lightsStatic.push({x,y,r:3.4});
    else if(b==='turm'||b==='mg') lightsStatic.push({x,y,r:1.1,a:.8});
    else if(AW[b]) lightsStatic.push({x,y,r:1.15,a:.75,warm:1});
    else if(b==='sirene') lightsStatic.push({x,y,r:1.2,a:.7});
  });
}
function rating(){
  if(!S.animals.length) return .5;
  const avgW=S.animals.reduce((s,a)=>s+a.w,0)/S.animals.length;
  const species=new Set(S.animals.map(a=>a.sp)).size;
  let deco=0; const shops=new Set();
  for(const t of S.tiles){ if(!t.b) continue; const B=BLD[t.b]; if(B.cat==='deco') deco++; if(B.cat==='shop') shops.add(t.b); }
  const sc=avgW/100*1.6+Math.min(1.4,species*.15)+Math.min(.6,deco*.02)+S.happy*1.2+Math.min(.4,shops.size*.06);
  return clamp(sc,.5,5);
}
function sellValue(a){ const p=SP[a.sp].p; return Math.floor(p*(a.age<3?.8:.6)*(.6+.4*a.w/100)); }

function setTab(id){ curTab=id; renderBottom(); $('tools').scrollLeft=0; }

function renderBottom(){

function renderTools(){

function refreshTools(){
  if(S.phase!=='day') return;
  const fresh=TABS.find(t=>t.id===curTab).items(), els=$('tools').children;
  if(fresh.length!==els.length) return renderTools();
  fresh.forEach((it,i)=>{ const el=els[i]; el.classList.toggle('poor',it.p>S.money);
    if(!!it.lock!==el.classList.contains('lock')){ curItems=fresh; renderTools(); } });
}
function pickTool(i){
  const it=curItems[i]; if(!it) return;
  if(it.lock){ toast(`${it.ic} ${it.n} gibt es ab ⭐${it.lock} Zoo-Bewertung. Mach deinen Zoo schöner!`); return; }
  cur=it; curKey=it.k+':'+(it.v||''); closeSheet(); renderTools();
  if(it.k==='build'&&BLD[it.v].d) toast(`${BLD[it.v].e} ${BLD[it.v].d}`);
  if(it.k==='animal'){ const s=SP[it.v]; toast(`${s.e} ${s.n}: braucht ${TERR[s.t].ic} ${TERR[s.t].n} · ${s.s} Feld${s.s>1?'er':''} Platz${s.pred?' · 🦷 Raubtier':''}`); }
  if(it.k==='terr') toast(`${TERR[it.v].ic} Male mit dem Finger ein ${TERR[it.v].n}-Gehege`);
  if(it.k==='path') toast('Male Wege vom Eingang aus');
}
function pickAnimalTool(id){ curTab='tiere'; curFilter=SP[id].t; renderBottom(); const i=curItems.findIndex(it=>it.v===id); if(i>=0) pickTool(i); }
function spend(p){ if(S.money<p){ toast('Nicht genug Geld 💸'); return false; } S.money-=p; return true; }
const adjPath=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>inb(x+dx,y+dy)&&isPath(tile(x+dx,y+dy).t));
function puff(x,y,col){ for(let i=0;i<8;i++){ const an=rnd(0,7); addP({type:'smoke',x:x+.5,y:y+.5,vx:Math.cos(an)*rnd(.5,1.5),vy:Math.sin(an)*rnd(.5,1.5),life:.5,max:.5,size:.12,col:col||'255,255,255'}); } }

function useTool(x,y){
  if(S.phase!=='day'||!inb(x,y)||!cur) return;
  const t=tile(x,y), it=cur; let changed=false;
  if(t.b==='gate'){ toast('Der Eingang bleibt stehen.'); return; }
  switch(it.k){
    case 'path':
      if(t.t===it.v) return; if(t.b){ toast('Erst abreißen 🚜'); return; }
      if(!spend(it.p)) return; t.t=it.v; changed=true; break;
    case 'terr':
      if(t.t===it.v) return; if(t.b&&BLD[t.b].cat!=='deco'){ toast('Erst abreißen 🚜'); return; }
      if(!spend(20)) return; t.t=it.v; changed=true; break;
    case 'bull':
      if(t.b){ S.money+=Math.floor(BLD[t.b].p/2); t.b=null; changed=true; }
      else if(t.t!=='empty'){ S.money+=isPath(t.t)?5:10; t.t='empty'; changed=true; }
      if(changed) puff(x,y,'160,130,90');
      break;
    case 'build': {
      const B=BLD[it.v];
      if(t.b){ toast('Hier steht schon etwas.'); return; }
      if(B.cat==='deco'){ if(isPath(t.t)){ toast('Nicht auf den Weg.'); return; } }
      else { if(t.t!=='empty'){ toast('Nur auf freier Wiese.'); return; }
             if((B.cat==='shop'||B.cat==='svc')&&!adjPath(x,y)){ toast('Muss direkt an einem Weg stehen.'); return; } }
      if(!spend(B.p)) return; t.b=it.v; changed=true; puff(x,y); sfx('build'); break; }
    case 'animal': {
      const sp=SP[it.v], r=rmap[y*COLS+x];
      if(sp.r>ratingC){ toast('Noch gesperrt'); return; }
      if(r<0||regions[r].t!==sp.t){ toast(`${sp.e} ${sp.n} braucht ein ${TERR[sp.t].ic} ${TERR[sp.t].n}-Gehege.`); return; }
      if(!spend(sp.p)) return;
      const same=regions[r].animals.filter(a=>a.sp===it.v&&a.age>=3);
      const m=same.filter(a=>a.sex==='m').length, f=same.length-m;
      const a=mkAnimal(it.v,x+.5,y+.5,m>f?'f':f>m?'m':null); S.animals.push(a); recompute();
      confetti(x+.5,y+.5,10); sfx('build');
      const reg=regions[r]; toast(`${sp.e} ${a.name} ${a.sex==='m'?'♂':'♀'} ist eingezogen!`+(reg.fight?' ⚔️ Achtung, Raubtier!':reg.spaceF<1?' Aber es ist zu eng 😟':''));
      renderTools(); return; }
  }
  if(changed){ recompute(); bgDirty=true; refreshTools(); }
}

const meter=(lb,v,col)=>`<div class="meter"><div class="lb"><span>${lb}</span><span>${Math.round(v)}%</span></div><div class="mbar"><i style="width:${clamp(v,0,100)}%;background:${col}"></i></div></div>`;
const wcol=w=>w>=75?'#2a9d8f':w>=50?'#f4a261':'#e63946';
function applyInfo(gx,gy){
  let best=null,bd=.6; for(const a of S.animals){ const d=dist(gx,gy,a.x,a.y); if(d<bd){bd=d;best=a;} }
  if(best) return showAnimal(best);

    seen:new Set(),col:`hsl(${ri(0,360)},70%,55%)`,hat:Math.random()<.4?`hsl(${ri(0,360)},70%,45%)`:null,balloon:null,pause:0,vx:0,ph:rnd(0,6)});

function guestArrive(g){
  const x=g.tx, y=g.ty;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const nx=x+dx, ny=y+dy; if(!inb(nx,ny)) continue;
    const r=rmap[ny*COLS+nx];
    if(r>=0&&!g.seen.has(r)&&regions[r].animals.length){
      g.seen.add(r); g.pause=rnd(.8,1.8);
      const ap=regions[r].animals.reduce((s,a)=>s+SP[a.sp].a*(a.age<3?1.5:1)*a.w/100,0);
      g.hap+=Math.min(.3,ap*.02);
      if(Math.random()<.5){ const d=1+Math.floor(ap/3); S.money+=d; floats.push({x:x+.5,y:y+.2,txt:`+${d}💰`,t:1,col:'#ffd166'}); }
    }
    const b=tile(nx,ny).b; if(!b) continue; const B=BLD[b];
    if(Math.abs(dx)+Math.abs(dy)===1){
      if(B.cat==='shop'&&g[B.need]>.45){ g[B.need]=0; g.hap+=.06; S.money+=B.price; floats.push({x:nx+.5,y:ny+.2,txt:`+${B.price}${B.e}`,t:1,col:'#fff'}); if(b==='ballon') g.balloon=`hsl(${ri(0,360)},80%,60%)`; }
      if(b==='wc'&&g.wc>.5){ g.wc=0; g.hap+=.03; }
      if(b==='bank'){ g.hap+=.015; g.pause=Math.max(g.pause,.6); }
      if(b==='muell') g.hap+=.006;
      if(b==='infost'&&!g.info){ g.info=1; g.hap+=.04; }
    }
    if(B.cat==='deco') g.hap+=b==='brunnen'||b==='statue'?.02:.004;
  }
  if(tile(x,y).t==='path2') g.hap+=.003;
  const opts=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>inb(a,b)&&isPath(tile(a,b).t));
  let next=opts.filter(([a,b])=>!(a===g.px&&b===g.py)); if(!next.length) next=opts;
  if(next.length){ const n=pick(next); g.px=x; g.py=y; g.tx=n[0]; g.ty=n[1]; }
}
function updateGuests(dt){
  for(let i=guests.length-1;i>=0;i--){
    const g=guests[i]; g.life-=dt; g.hunger+=dt*.018; g.thirst+=dt*.022; g.wc+=dt*.02; g.fun+=dt*.012;
    if(g.hunger>1||g.thirst>1||g.wc>1) g.hap-=dt*.012;
    const cx=g.tx+.5, cy=g.ty+.5, d=dist(g.x,g.y,cx,cy);
    if(d<.04){ g.x=cx; g.y=cy; if(g.pause>0) g.pause-=dt; else guestArrive(g); }
    else { const s=Math.min(d,1.3*dt); g.vx=cx-g.x; g.x+=(cx-g.x)/d*s; g.y+=(cy-g.y)/d*s; }
    if(g.life<=0){ S.happy=S.happy*.92+clamp(g.hap,0,1)*.08; guests.splice(i,1); }
  }
}

function updateAnimals(dt){
  for(const a of S.animals){
    if(a.carried) continue;
    if(a.wait>0){ a.wait-=dt; a.vx=0; if(S.phase==='day'&&a.age>=3&&a.w>=80&&Math.random()<dt*.025) addP({type:'emo',x:a.x,y:a.y-.4,vx:0,vy:-.5,life:1.2,max:1.2,size:.28,txt:'❤️'}); continue; }
    const d=dist(a.x,a.y,a.tx,a.ty);
    if(d<.05){
      a.wait=a.home?.2:rnd(1,4); a.home=false; const reg=regions[a.r];
      if(reg&&reg.tiles.length){ const t=pick(reg.tiles); a.tx=t[0]+rnd(.25,.75); a.ty=t[1]+rnd(.25,.75); }
    } else { const s=Math.min(d,(a.home?2:(a.age<3?.8:.6))*dt); a.vx=a.tx-a.x; a.x+=(a.tx-a.x)/d*s; a.y+=(a.ty-a.y)/d*s; }
  }
}
function morning(){
  S.animals.forEach(a=>a.age++);
  recompute();
  const born=[];
  for(const reg of regions){
    const groups={}; reg.animals.forEach(a=>(groups[a.sp]=groups[a.sp]||[]).push(a));
    for(const id in groups){
      const g=groups[id], ad=g.filter(a=>a.age>=3), f=ad.find(a=>a.sex==='f'), m=ad.find(a=>a.sex==='m');
      if(!f||!m||reg.w<70||g.length>=8) continue;
      if(Math.random()>.45+(reg.care>=15?.15:0)) continue;
      const b=mkAnimal(id,f.x,f.y,null,0); S.animals.push(b); born.push({b,f}); S.st.born++;
    }
  }
  recompute();
  let up=0; S.animals.forEach(a=>up+=SP[a.sp].u*(a.age<3?.5:1)); S.tiles.forEach(t=>{ if(t.b&&BLD[t.b].u) up+=BLD[t.b].u; });

}

function pickTarget(e){
  const avail=S.animals.filter(a=>!a.carried);
  const free=avail.filter(a=>!enemies.some(o=>o!==e&&!o.dead&&o.target===a));
  const pool=free.length?free:avail; if(!pool.length) return null;
  let best=null,bd=1e9; for(const a of pool){ const d=dist(e.x,e.y,a.x,a.y)+rnd(0,4); if(d<bd){bd=d;best=a;} } return best;
}
function setExit(e){

}

function explode(x,y,r,dmg,w,stun){

    return;
  }
  sfx('boom'); shake=Math.min(1,shake+.55); tlights.push({x,y,r:r*2.6,a:1,t:.35,max:.35});

}

function updatePlayer(dt){
  const p=player; p.flash-=dt; p.hurt=Math.max(0,p.hurt-dt*1.5);
  if(p.dead>0){ p.dead-=dt; if(p.dead<=0){ p.dead=0; p.hp=p.max; p.x=GX+.5; p.y=GY-.6; showBanner('Zurück im Einsatz',''); } return; }
  const gid=curGun(), g=gunStats(gid);
  if(joy){ const m=Math.hypot(joy.dx,joy.dy); if(m>5){ const k=Math.min(1,m/45)*3.1*g.mob*(hasPerk('sprinter')?1.25:1)*dt; p.x+=joy.dx/m*k; p.y+=joy.dy/m*k; if(!fire) p.ang=Math.atan2(joy.dy,joy.dx); } }
  p.x=clamp(p.x,.3,COLS-.3); p.y=clamp(p.y,.3,ROWS-.3);
  if(hasPerk('regen')&&time-p.lastHit>3) p.hp=Math.min(p.max,p.hp+4*dt);
  for(const h of healers) if(dist(p.x,p.y,h.x,h.y)<1.7) p.hp=Math.min(p.max,p.hp+12*dt);
  if(p.rel>0){ p.rel-=dt; if(p.rel<=0) p.ammo[gid]=g.mag; }
  p.cd-=dt;
  if(g.spin) p.spin=fire?Math.min(1,p.spin+dt*1.3):Math.max(0,p.spin-dt*2);
  p.tgt=null; let bd=g.rng; for(const e of enemies){ if(e.dead) continue; const d=dist(p.x,p.y,e.x,e.y); if(d<bd){bd=d;p.tgt=e;} }
  if(fire){
    p.ang=p.tgt?Math.atan2(p.tgt.y-p.y,p.tgt.x-p.x):Math.atan2(fire.y-p.y,fire.x-p.x);
    if(p.rel<=0&&p.cd<=0&&(!g.spin||p.spin>.55)){
      if(p.ammo[gid]>0){ p.ammo[gid]--; p.cd=1/(g.rate*(g.spin?p.spin:1)); p.flash=.06; shoot(g,gid); if(p.ammo[gid]<=0) reload(); }
      else reload();
    }
  }
}
function updateNight(dt){
  const n=night, p=player;
  if(n.queue.length){ n.spawnT-=dt; if(n.spawnT<=0){ spawnEnemy(n.queue.shift()); n.spawnT=Math.max(.45,2-S.day*.08)*rnd(.6,1.3); } }
  updatePlayer(dt);
  // Türme
  for(const tw of towers){ tw.cd-=dt; if(tw.cd>0) continue; const B=BLD[tw.b].tw; let tg=null,bd=B.r;

    if(hg&&!s.multi){ R(x2,13,hg,7.5,1.5,s.glow?'#123a44':mid); c.fillStyle=hl; for(let i=2;i<hg-1;i+=3) c.fillRect(x2+i,15,1.2,3.5); }
    if(s.pump){ R(x2,19,hg+bl-4,2.6,1,dark); R(x2+5,18.2,11,4.4,1.5,mid); }

    if(s.sc===1){ R(x1+6,8,9,4,1,dark); c.fillStyle='#ff3b3b'; c.fillRect(x1+13,9.2,1.3,1.3); }
    if(s.sc===2){ R(x1+2,6,24,5,2.5,dark); R(x1-1,5,5,7,2,mid); R(x1+24,5,5,7,2,mid); c.fillStyle='rgba(90,200,250,.7)'; c.fillRect(x1+27.6,6,1.2,5); R(x1+10,10,2,2.5,.5,dark); R(x1+16,10,2,2.5,.5,dark); }
    if(s.tank){ R(x1+4,6,14,5,2.5,locked?mid:'#2f8f5f'); }
    if(s.net){ P([x3+bl-2,14.5,x3+bl+8,8,x3+bl+8,26,x3+bl-2,19.5],mid); }
    if(s.glow&&!locked){ c.shadowColor='#3ff'; c.shadowBlur=8; c.fillStyle='#6ff'; for(let i=0;i<4;i++) c.fillRect(x2+2+i*4.5,14.5,2.6,4.5); c.shadowBlur=0; }
    c.fillStyle=hl; c.fillRect(x1+2,12.6,rl-4,.9);
  }
  c.restore();
  if(locked){ c.save(); c.font=`${Math.round(ch*.42)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.globalAlpha=.85; c.fillText('🔒',cw/2,ch/2); c.restore(); }
}

  const na=S.phase==='night'?.74:duskA(); if(na>0) drawLight(na);
  ctx.lineWidth=2;
  for(const h of hitm){ const s=T*.15*(1+(1-h.t/.25)*.4), X=h.x*T, Y=h.y*T; ctx.globalAlpha=h.t/.25; ctx.strokeStyle=h.kill?'#ff4d4d':'#fff'; ctx.beginPath();
    for(const[dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ ctx.moveTo(X+dx*s,Y+dy*s); ctx.lineTo(X+dx*s*.4,Y+dy*s*.4); } ctx.stroke(); }
  ctx.globalAlpha=1;
  for(const f of floats){ const a=clamp(f.t,0,1), sz=Math.round(T*(f.sz||.34)), y=(f.y-(1.2-f.t)*.6)*T;
    ctx.globalAlpha=a; ctx.font=`700 ${sz}px Fredoka,system-ui,sans-serif`; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.65)'; ctx.strokeText(f.txt,f.x*T,y); ctx.fillStyle=f.col||'#fff'; ctx.fillText(f.txt,f.x*T,y); }
  ctx.globalAlpha=1;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(S.phase==='night'&&player&&player.dead<=0){
    if(player.tgt){ const e=player.tgt, X=e.x*T, Y=e.y*T, s=T*ET[e.type].r*1.5; ctx.strokeStyle='rgba(255,70,70,.95)'; ctx.lineWidth=2; ctx.beginPath();
      for(const[dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ ctx.moveTo(X+dx*s,Y+dy*s*.5); ctx.lineTo(X+dx*s,Y+dy*s); ctx.lineTo(X+dx*s*.5,Y+dy*s); } ctx.stroke(); }
    else if(fire){ const X=fire.x*T, Y=fire.y*T; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(X,Y,10,0,7); ctx.moveTo(X-16,Y); ctx.lineTo(X-6,Y); ctx.moveTo(X+6,Y); ctx.lineTo(X+16,Y); ctx.moveTo(X,Y-16); ctx.lineTo(X,Y-6); ctx.moveTo(X,Y+6); ctx.lineTo(X,Y+16); ctx.stroke(); }
    if(joy){ const r=cv.getBoundingClientRect(), ox=joy.ox-r.left, oy=joy.oy-r.top, m=Math.hypot(joy.dx,joy.dy)||1, k=Math.min(42,m);
      ctx.fillStyle='rgba(255,255,255,.12)'; ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ox,oy,44,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(ox+joy.dx/m*k,oy+joy.dy/m*k,19,0,7); ctx.fill(); }
  }
}

// =====================================================================
//  EINGABE
// =====================================================================
let drawing=false, lastTile='', joy=null, fire=null;
function toGrid(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/T,(e.clientY-r.top)/T]; }
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); ac(); try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(isPaused()) return; const [gx,gy]=toGrid(e);
  if(S.phase==='night'){ if(gx<COLS/2&&!joy) joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0}; else if(!fire) fire={id:e.pointerId,x:gx,y:gy}; return; }
  if(!cur||cur.k==='info'){ applyInfo(gx,gy); return; }
  drawing=true; lastTile=''; applyAt(gx,gy);
});
cv.addEventListener('pointermove',e=>{
  const [gx,gy]=toGrid(e);
  if(S.phase==='night'){ if(joy&&joy.id===e.pointerId){ joy.dx=e.clientX-joy.ox; joy.dy=e.clientY-joy.oy; } if(fire&&fire.id===e.pointerId){ fire.x=gx; fire.y=gy; } return; }
  if(drawing&&paintable(cur)) applyAt(gx,gy);
});
function endPtr(e){ if(joy&&joy.id===e.pointerId) joy=null; if(fire&&fire.id===e.pointerId) fire=null; drawing=false; }
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
function applyAt(gx,gy){ const x=Math.floor(gx), y=Math.floor(gy), k=x+','+y; if(k===lastTile) return; lastTile=k; useTool(x,y); }
const tapBtn=(id,fn)=>$(id).addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); ac(); fn(); });
tapBtn('bSwap',swapGun); tapBtn('bRel',reload); tapBtn('bNade',throwNade); tapBtn('bMed',useMed);

// =====================================================================
//  HUD & SCHLEIFE
// =====================================================================
let toastT=0;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); toastT=3.2; }
function showBanner(a,b){ const el=$('banner'); el.innerHTML=`<div class="b1">${a}</div>${b?`<div class="b2">${b}</div>`:''}`; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function hud(){
  $('hMoney').textContent=fmt(S.money); $('cMoney').classList.toggle('neg',S.money<0);
  $('hRate').textContent=ratingC.toFixed(1);
  if(S.phase==='day'){ $('hDay').textContent=`☀️ Tag ${S.day}`; $('dayI').style.width=(S.dayT/DAY_LEN*100)+'%'; $('bSpeed').textContent=speed===0?'⏸ Pause':speed===1?'▶ 1×':'⏩ 3×'; }
  else if(night&&player){
    const left=night.queue.length+enemies.length; $('hDay').textContent=`🌙 ${night.n} · 🥷${left}`; $('dayI').style.width=((1-left/Math.max(1,night.total))*100)+'%';
    const p=player, gid=curGun(), g=gunStats(gid);
    $('hpI').style.width=clamp(p.hp/p.max,0,1)*100+'%'; $('hpI').style.background=p.hp/p.max<.35?'linear-gradient(90deg,#e63946,#ff6b6b)':''; $('hpT').textContent=Math.max(0,Math.ceil(p.hp));
    $('amN').innerHTML=p.rel>0?'<span class="rl">Lädt nach…</span>':`${p.ammo[gid]}<small> / ${g.mag}</small>`;
    $('amW').textContent=W[gid].n+(g.spin&&p.spin<.55&&fire?' · läuft an…':'');
    $('relI').style.width=p.rel>0?(1-p.rel/p.relMax)*100+'%':'0';
    $('nadeN').textContent=night.nades; $('medN').textContent=night.meds;
    $('swapN').textContent=S.lo.s?W[p.slot==='p'?S.lo.s:S.lo.p].n.split(' ')[0]:'—';
    $('hurt').style.opacity=p.hurt;
  }
}
let last=performance.now(), hudT=0, ratT=0, toolT=0, saveT=0;
function loop(now){
  const raw=Math.min(.05,Math.max(0,(now-last)/1000)); last=now; time+=raw;
  if(!isPaused()){
    if(S.phase==='day'){
      const dt=raw*speed;
      if(speed>0){
        S.dayT+=dt; spawnT-=dt;
        if(spawnT<=0){ if(guests.length<60) spawnGuest(); spawnT=clamp(7/ratingC,.6,8); }
        updateGuests(dt); updateAnimals(dt);
        if(S.dayT>=DAY_LEN){ S.dayT=DAY_LEN; openDusk(); }
      }
    } else if(night){ updateAnimals(raw); updateNight(raw); }
    updateFx(raw);
  }
  if(toastT>0){ toastT-=raw; if(toastT<=0) $('toast').classList.remove('on'); }
  ratT-=raw; if(ratT<=0){ ratingC=rating(); ratT=.5; }
  hudT-=raw; if(hudT<=0){ hud(); hudT=.12; }
  toolT-=raw; if(toolT<=0){ refreshTools(); toolT=1; }
  saveT-=raw; if(saveT<=0){ if(S.phase==='day') save(); saveT=15; }
  draw(); requestAnimationFrame(loop);
}
$('bSpeed').onclick=()=>{ speed=speed===1?3:speed===3?0:1; hud(); };
$('bNight').onclick=()=>openDusk();
$('bArm').onclick=()=>{ if(S.phase==='night'){ toast('Die Waffenkammer ist nur tagsüber offen.'); return; } openArmory(); };
$('bZoo').onclick=()=>{ if(S.phase==='night'){ toast('Erst die Nacht überstehen!'); return; } openZoo(); };
$('bMenu').onclick=()=>openMenu();
$('modal').addEventListener('pointerdown',e=>{ if(e.target===$('modal')&&S.phase==='day'&&!$('mbox').innerHTML.includes('Aufklärung')&&!$('mbox').innerHTML.includes('Einsatzbericht')) closeModal(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.phase==='day') save(); });
window.addEventListener('resize',resize);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ bgDirty=true; });

// =====================================================================
//  START
// =====================================================================
const firstRun=!load();
if(firstRun) newGame();
cur=TABS[0].items()[0]; ratingC=rating();
renderBottom(); resize(); requestAnimationFrame(loop);
if(firstRun) openHelp();
</script>
</body>
